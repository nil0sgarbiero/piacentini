@if (visivel()) {
  <div style="position: fixed; inset: 0; background: rgba(0, 0, 0, 0.4); display: flex; align-items: center; justify-content: center; z-index: 1000;">
    <div class="painel" style="background: #fff; border-radius: 8px; min-width: 420px; max-width: 90vw; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);">
      <div class="painel-header" style="padding: 16px; border-bottom: 1px solid #e0e0e0;">
        <h3 style="margin: 0;">Editar Usuário</h3>
      </div>

      <div class="painel-conteudo">
        <form>
          <div class="form-group">
            <label>Nome</label>
            <input
              name="nome"
              type="text"
              [(ngModel)]="usuario.nome"
              placeholder="Nome do usuário">
          </div>

          <div class="form-group">
            <label>Login</label>
            <input
              name="login"
              type="text"
              [(ngModel)]="usuario.login"
              placeholder="Login de acesso">
          </div>

          <div class="form-group">
            <label>Perfil</label>
            <po-select
              name="perfil"
              [ngModel]="usuario.perfil"
              (ngModelChange)="usuario.perfil = $event"
              [p-options]="perfis">
            </po-select>
          </div>

          <div class="form-group">
            <label>Status</label>
            <div style="display: flex; gap: 16px;">
              <label style="display: flex; align-items: center; cursor: pointer;">
                <input type="radio" name="ativo" [value]="true" [(ngModel)]="usuario.ativo" style="margin-right: 4px;">
                <span>Ativo</span>
              </label>
              <label style="display: flex; align-items: center; cursor: pointer;">
                <input type="radio" name="ativo" [value]="false" [(ngModel)]="usuario.ativo" style="margin-right: 4px;">
                <span>Inativo</span>
              </label>
            </div>
          </div>

          <div class="botoes">
            <button type="button" (click)="onCancelar()">Cancelar</button>
            <button type="button" (click)="salvar()">Salvar Alterações</button>
          </div>
        </form>
      </div>
    </div>
  </div>
}
